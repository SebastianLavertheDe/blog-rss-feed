  name: Generate RSS Feeds

  on:
    schedule:
      - cron: '10 23 * * *'
    workflow_dispatch:
    push:
      branches: [ main ]
      paths:
        - 'script/**'
        - 'run_all.py'
        - 'config.yaml'
        - 'requirements.txt'
        - '.github/workflows/generate-rss.yml'

  jobs:
    generate-rss:
      runs-on: ubuntu-latest
      permissions:
        contents: write

      steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Generate all RSS feeds  
        run: python run_all.py

      - name: Commit and push RSS feeds
        run: |
          git config --local user.email "SebastianLavertheDe@noreplay.github.com"
          git config --local user.name "SebastianLavertheDe"
          git add "**/*.xml"
          git diff --staged --quiet || (git commit -m "Update RSS feeds - $(date -u)" && git push)
