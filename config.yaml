# RSS Feed Generator Configuration

# Global options
options:
  # Directory where RSS XML files will be saved (use . for root directory)
  output_dir: .

  # Directory containing the RSS generator scripts
  script_dir: script

  # Create output directory if it doesn't exist
  create_output_dir: true

  # Stop execution on first error (set to true to fail fast)
  stop_on_error: false

  # Base URL for generating full URLs in OPML (optional)
  # Example: https://your-domain.com/
  base_url: ''

  # OPML output configuration
  opml:
    enabled: true
    output_file: blog_rss.xml
    title: All Articles RSS Subscriptions for bestblogs.dev
    # Base URL for RSS feeds (optional, leave empty for relative paths)
    base_url: ''

# Scripts to run (in order)
scripts:
  - name: Anthropic Engineering
    file: anthropic_rss.py
    output: anthropic_engineering_rss.xml
    title: Anthropic Engineering Blog
    enabled: true

  - name: Cursor Blog
    file: cursor_rss.py
    output: cursor_blog_rss.xml
    title: Cursor Blog
    enabled: true

  - name: Claude Blog
    file: claude_blog_rss.py
    output: claude_blog_rss.xml
    title: Claude Blog
    enabled: true
