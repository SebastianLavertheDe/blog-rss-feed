# RSS Feed Generator Configuration

# Global options
options:
  # Directory where RSS XML files will be saved
  output_dir: rss

  # Directory containing the RSS generator scripts
  script_dir: script

  # Create output directory if it doesn't exist
  create_output_dir: true

  # Stop execution on first error (set to true to fail fast)
  stop_on_error: false

  # Base URL for generating full URLs in OPML (optional)
  # Example: https://your-domain.com/
  base_url: ''

  # OPML output configuration
  opml:
    enabled: true
    # Base URL for RSS feeds (full GitHub URL)
    base_url: https://raw.githubusercontent.com/SebastianLavertheDe/blog-rss-feed/main/rss
    # Multiple OPML outputs by category
    outputs:
      - name: blog_rss.xml
        title: Blog RSS Subscriptions for bestblogs.dev
        categories: [blog]
        # Static feeds that are always included in OPML
        static_feeds: []

# Scripts to run (in order)
scripts:
  - name: Anthropic Engineering
    file: anthropic_engineering_rss.py
    output: anthropic_engineering_rss.xml
    title: Anthropic Engineering Blog
    category: blog
    enabled: true

